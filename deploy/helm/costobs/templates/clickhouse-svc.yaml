{{- if .Values.clickhouse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "costobs.clickhouse.serviceName" . }}
  labels:
    {{- include "costobs.componentLabels" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.clickhouse.service.httpPort }}
      targetPort: http
    - name: native
      port: {{ .Values.clickhouse.service.nativePort }}
      targetPort: native
  selector:
    {{- include "costobs.componentSelectorLabels" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
{{- end }}
