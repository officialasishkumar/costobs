{{/*
Chart-managed credentials Secret.

Holds the DSNs (and bundled passwords / dev key) that the workloads consume by
reference. We assemble DSNs HERE so the rendered Deployments only carry Secret
references, never plaintext passwords in env.

We only emit a key when this chart is the source of truth for it:
  * bundled Postgres/ClickHouse  -> we own password + DSN
  * external WITHOUT existingSecret -> we store the operator-supplied DSN here
  * external WITH existingSecret    -> we emit nothing; refs point at that secret
*/}}
{{- /* ---------- Postgres ---------- */ -}}
{{- $pgManaged := false -}}
{{- $pgDSN := "" -}}
{{- $pgPassword := "" -}}
{{- if .Values.postgres.enabled -}}
  {{- $pgManaged = true -}}
  {{- $pgPassword = include "costobs.postgres.password" . -}}
  {{- $pgUser := .Values.postgres.auth.username -}}
  {{- $pgDB := .Values.postgres.auth.database -}}
  {{- $pgHost := include "costobs.postgres.serviceName" . -}}
  {{- $pgPort := .Values.postgres.service.port | int -}}
  {{- $pgDSN = printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" $pgUser $pgPassword $pgHost $pgPort $pgDB -}}
{{- else if not .Values.postgres.external.existingSecret -}}
  {{- $pgManaged = true -}}
  {{- $pgDSN = required "postgres.external.dsn is required when postgres.enabled=false and no external.existingSecret is set" .Values.postgres.external.dsn -}}
{{- end -}}

{{- /* ---------- ClickHouse ---------- */ -}}
{{- $chManaged := false -}}
{{- $chDSN := "" -}}
{{- $chHTTP := "" -}}
{{- $chMigrate := "" -}}
{{- $chPassword := "" -}}
{{- if .Values.clickhouse.enabled -}}
  {{- $chManaged = true -}}
  {{- $chPassword = include "costobs.clickhouse.password" . -}}
  {{- $chUser := .Values.clickhouse.auth.username -}}
  {{- $chDB := .Values.clickhouse.auth.database -}}
  {{- $chHost := include "costobs.clickhouse.serviceName" . -}}
  {{- $chNative := .Values.clickhouse.service.nativePort | int -}}
  {{- $chHTTPPort := .Values.clickhouse.service.httpPort | int -}}
  {{- $chDSN = printf "clickhouse://%s:%s@%s:%d/%s" $chUser $chPassword $chHost $chNative $chDB -}}
  {{- $chHTTP = printf "http://%s:%s@%s:%d/%s" $chUser $chPassword $chHost $chHTTPPort $chDB -}}
  {{- /* golang-migrate clickhouse driver form (query-param creds + multi-statement) */ -}}
  {{- $chMigrate = printf "clickhouse://%s:%d?username=%s&password=%s&database=%s&x-multi-statement=true" $chHost $chNative $chUser $chPassword $chDB -}}
{{- else if not .Values.clickhouse.external.existingSecret -}}
  {{- $chManaged = true -}}
  {{- $chDSN = required "clickhouse.external.dsn is required when clickhouse.enabled=false and no external.existingSecret is set" .Values.clickhouse.external.dsn -}}
  {{- $chHTTP = required "clickhouse.external.httpUrl is required when clickhouse.enabled=false and no external.existingSecret is set" .Values.clickhouse.external.httpUrl -}}
  {{- /* Append the multi-statement flag golang-migrate needs for the MV migration. */ -}}
  {{- if contains "?" $chDSN -}}
  {{- $chMigrate = printf "%s&x-multi-statement=true" $chDSN -}}
  {{- else -}}
  {{- $chMigrate = printf "%s?x-multi-statement=true" $chDSN -}}
  {{- end -}}
{{- end -}}

{{- /* ---------- Dev API key ---------- */ -}}
{{- $devKeyManaged := and .Values.devSeed.enabled (not .Values.devSeed.existingSecret) -}}

{{- if or $pgManaged $chManaged $devKeyManaged }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costobs.secretName" . }}
  labels:
    {{- include "costobs.labels" . | nindent 4 }}
  annotations:
    # Keep generated passwords stable across upgrades.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if $pgManaged }}
  postgres-dsn: {{ $pgDSN | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ $pgPassword | quote }}
  {{- end }}
  {{- end }}
  {{- if $chManaged }}
  clickhouse-dsn: {{ $chDSN | quote }}
  clickhouse-http-url: {{ $chHTTP | quote }}
  clickhouse-migrate-dsn: {{ $chMigrate | quote }}
  {{- if .Values.clickhouse.enabled }}
  clickhouse-password: {{ $chPassword | quote }}
  {{- end }}
  {{- end }}
  {{- if $devKeyManaged }}
  dev-api-key: {{ .Values.devSeed.apiKey | quote }}
  {{- end }}
{{- end }}
