{{/*
billsyncd — SINGLETON billing sync. Pulls actual billed cost from provider
admin APIs into ClickHouse billed_daily for the reconciliation view. Strictly
opt-in: rendered only when billsyncd.enabled, and the fetchers only run for
providers whose admin keys are set (billsyncd.billingKeys / existingSecret).
This is the only CostObs component that makes outbound calls.
*/}}
{{- if .Values.billsyncd.enabled }}
{{- $chSecret := include "costobs.clickhouse.dsnSecret" . | fromJson -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "costobs.fullname" . }}-billsyncd
  labels:
    {{- include "costobs.componentLabels" (dict "ctx" . "component" "billsyncd") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "costobs.componentSelectorLabels" (dict "ctx" . "component" "billsyncd") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "costobs.componentSelectorLabels" (dict "ctx" . "component" "billsyncd") | nindent 8 }}
      annotations:
        {{- range $k, $v := .Values.metrics.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        prometheus.io/port: {{ .Values.billsyncd.port | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.billsyncd.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "costobs.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: billsyncd
          image: {{ include "costobs.image" (dict "ctx" . "image" .Values.billsyncd.image) }}
          imagePullPolicy: {{ include "costobs.pullPolicy" (dict "ctx" . "image" .Values.billsyncd.image) }}
          ports:
            - name: http
              containerPort: {{ .Values.billsyncd.port }}
          env:
            - name: COSTOBS_HTTP_ADDR
              value: ":{{ .Values.billsyncd.port }}"
            - name: COSTOBS_CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $chSecret.name }}
                  key: {{ $chSecret.key }}
            - name: COSTOBS_ORG_SLUG
              value: {{ .Values.billsyncd.orgSlug | quote }}
            - name: COSTOBS_SYNC_INTERVAL
              value: {{ .Values.billsyncd.syncInterval | quote }}
            - name: COSTOBS_SYNC_LOOKBACK_DAYS
              value: {{ .Values.billsyncd.lookbackDays | quote }}
            {{- $keysSecret := .Values.billsyncd.existingBillingKeysSecret | default (printf "%s-billing-keys" (include "costobs.fullname" .)) }}
            - name: COSTOBS_BILLING_OPENAI_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $keysSecret }}
                  key: openai-admin-key
                  optional: true
            - name: COSTOBS_BILLING_ANTHROPIC_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $keysSecret }}
                  key: anthropic-admin-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.billsyncd.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.billsyncd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.billsyncd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.billsyncd.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.billsyncd.enabled (not .Values.billsyncd.existingBillingKeysSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costobs.fullname" . }}-billing-keys
  labels:
    {{- include "costobs.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-admin-key: {{ .Values.billsyncd.billingKeys.openaiAdminKey | quote }}
  anthropic-admin-key: {{ .Values.billsyncd.billingKeys.anthropicAdminKey | quote }}
{{- end }}
