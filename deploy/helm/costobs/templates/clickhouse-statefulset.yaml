{{- if .Values.clickhouse.enabled }}
{{/*
Bundled single-node ClickHouse (events / time-series store). For large or HA
deployments set clickhouse.enabled=false and BYO ClickHouse Cloud / a cluster.
Credentials are seeded from env (mirrors the compose image config); the
password comes from the chart-managed creds Secret.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "costobs.clickhouse.serviceName" . }}
  labels:
    {{- include "costobs.componentLabels" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
spec:
  serviceName: {{ include "costobs.clickhouse.serviceName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "costobs.componentSelectorLabels" (dict "ctx" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "costobs.componentSelectorLabels" (dict "ctx" . "component" "clickhouse") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "costobs.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: {{ include "costobs.image" (dict "ctx" . "image" .Values.clickhouse.image) }}
          imagePullPolicy: {{ include "costobs.pullPolicy" (dict "ctx" . "image" .Values.clickhouse.image) }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.auth.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.auth.username | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "costobs.secretName" . }}
                  key: clickhouse-password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      {{- if not .Values.clickhouse.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.clickhouse.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "costobs.componentLabels" (dict "ctx" . "component" "clickhouse") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ .Values.clickhouse.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size | quote }}
  {{- end }}
{{- end }}
