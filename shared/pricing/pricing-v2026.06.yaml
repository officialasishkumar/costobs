# CostObs pricing data — source of truth, consumed by SDK + backend.
# Per-token prices (NOT per-1M) to keep the SDK hot path a single multiply.
# Edit this file and bump `version`; no SDK release required.
version: "2026.06"
currency: USD
models:
  # ---- OpenAI ----
  - provider: openai
    model: gpt-4o
    match: prefix
    input_per_token: 0.0000025
    cached_input_per_token: 0.00000125
    output_per_token: 0.00001
    image_tiers:
      - name: default
        per_tile: 0.000213
        base: 0.0

  - provider: openai
    model: gpt-4o-mini
    match: prefix
    input_per_token: 0.00000015
    cached_input_per_token: 0.000000075
    output_per_token: 0.0000006

  - provider: openai
    model: o3
    match: prefix
    input_per_token: 0.000002
    cached_input_per_token: 0.0000005
    output_per_token: 0.000008
    reasoning_per_token: 0.000008   # reasoning billed at output rate

  - provider: openai
    model: text-embedding-3-small
    operation: embedding
    input_per_token: 0.00000002
    output_per_token: 0.0

  # ---- Anthropic ----
  - provider: anthropic
    model: claude-opus-4
    match: prefix
    input_per_token: 0.000015
    cached_input_per_token: 0.0000015   # cache-read rate
    output_per_token: 0.000075

  - provider: anthropic
    model: claude-sonnet-4
    match: prefix
    input_per_token: 0.000003
    cached_input_per_token: 0.0000003
    output_per_token: 0.000015

  - provider: anthropic
    model: claude-haiku-4
    match: prefix
    input_per_token: 0.0000008
    cached_input_per_token: 0.00000008
    output_per_token: 0.000004

  # ---- Google Gemini ----
  - provider: gemini
    model: gemini-2.5-pro
    match: prefix
    input_per_token: 0.00000125
    cached_input_per_token: 0.0000003125
    output_per_token: 0.00001

  - provider: gemini
    model: gemini-2.5-flash
    match: prefix
    input_per_token: 0.0000003
    cached_input_per_token: 0.000000075
    output_per_token: 0.0000025

  # ---- xAI ----
  - provider: xai
    model: grok-4
    match: prefix
    input_per_token: 0.000003
    cached_input_per_token: 0.00000075
    output_per_token: 0.000015

  - provider: xai
    model: grok-3-mini
    match: prefix
    input_per_token: 0.0000003
    output_per_token: 0.0000005

  # ---- DeepSeek ----
  - provider: deepseek
    model: deepseek-chat
    match: prefix
    input_per_token: 0.00000027
    cached_input_per_token: 0.00000007
    output_per_token: 0.0000011

  - provider: deepseek
    model: deepseek-reasoner
    match: prefix
    input_per_token: 0.00000055
    output_per_token: 0.00000219
    reasoning_per_token: 0.00000219

  # ---- Mistral ----
  - provider: mistral
    model: mistral-large
    match: prefix
    input_per_token: 0.000002
    output_per_token: 0.000006

  # ---- AWS Bedrock (model IDs as the Bedrock runtime reports them) ----
  - provider: bedrock
    model: anthropic.claude-opus-4
    match: prefix
    input_per_token: 0.000015
    cached_input_per_token: 0.0000015
    output_per_token: 0.000075

  - provider: bedrock
    model: anthropic.claude-sonnet-4
    match: prefix
    input_per_token: 0.000003
    cached_input_per_token: 0.0000003
    output_per_token: 0.000015

  - provider: bedrock
    model: anthropic.claude-haiku-4
    match: prefix
    input_per_token: 0.0000008
    cached_input_per_token: 0.00000008
    output_per_token: 0.000004

  - provider: bedrock
    model: amazon.nova-pro
    match: prefix
    input_per_token: 0.0000008
    output_per_token: 0.0000032

  - provider: bedrock
    model: amazon.nova-lite
    match: prefix
    input_per_token: 0.00000006
    output_per_token: 0.00000024

  # ---- Audio: STT (per-second billing) ----
  - provider: deepgram
    model: nova-3
    match: prefix
    operation: audio
    audio_per_second: 0.0000071

  - provider: deepgram
    model: nova-2
    match: prefix
    operation: audio
    audio_per_second: 0.0000060

  # ---- Audio: TTS (per-character billing) ----
  - provider: elevenlabs
    model: eleven_multilingual_v2
    match: prefix
    operation: audio
    per_character: 0.0003

  - provider: elevenlabs
    model: eleven_turbo_v2
    match: prefix
    operation: audio
    per_character: 0.00015

  - provider: elevenlabs
    model: eleven_flash_v2
    match: prefix
    operation: audio
    per_character: 0.00015
